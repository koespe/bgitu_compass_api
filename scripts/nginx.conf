upstream app_server {
    server unix:/home/user1/bgitu_api/run/gunicorn.sock fail_timeout=0;
}
server {
    listen 80;
    server_name api.bgitu-compass.ru;

    keepalive_timeout 5;
    client_max_body_size 4G;

    proxy_read_timeout 600;  # Увеличиваем таймаут ожидания ответа от сервера

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        if (!-f $request_filename) {
            proxy_pass http://app_server;
            break;
        }
    }
}